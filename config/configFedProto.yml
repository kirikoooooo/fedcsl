ablation:
  UseJointKD: False
  UseJointCL: False
  UseScaleKD: False
  UseScaleCL: False
  UseProdictor: False
  UseMTLHomo: False
  UseACF: False
  UseDistribution: False

# FedProto 方法专属超参，移植自 FL-bench src/server/fedproto.py:get_hyperparams
fedproto:
  lamda: 1.0   # MSE 原型对齐损失权重

logPath: "./result/"
description: "fedproto"
