# Local observability stack for FedCSL.
#
#   cd deploy/observability
#   docker compose up -d
#   # exporter (on the host):
#   python -m observability.exporter --root observability/runs --port 9108
#
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000  (admin / fedcsl by default)
#
# Images are pulled through the DaoCloud mirror because direct Docker Hub
# access is blocked on this workstation. Override FEDCSL_IMAGE_PREFIX if your
# environment can reach docker.io directly.
name: fedcsl-observability

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-docker.m.daocloud.io/prom/prometheus:v2.53.0}
    container_name: fedcsl-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-docker.m.daocloud.io/grafana/grafana:10.4.5}
    container_name: fedcsl-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fedcsl}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fedcsl-overview.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
