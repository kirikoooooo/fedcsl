model:
  name: ""
  params:
    dist_measure: "mix"
    lr: 0.1
    batch_size: 8
    wd: 0
    ls: 1
    l: 0.01
    beta: 0.4
    gamma: 0.7
dataset: "AtrialFibrillation"
algo: "fedcsl-onehot-splitteacher"
federated:
  numClient: 50
  numRound: 200
  numEpoch: 3
  dirichlet_alpha: 1
  use_client_selection: False
  client_selection_ratio: 0.6
  checkpoint_every: 30
  auto_resume: True

spilter:
  # efficiency_aware: 2个基础尺度 + 系统效率感知补发；uniform_single: client_id 轮转，每个客户端只训练1个尺度。
  allocation_mode: "uniform_single"
  # 每个客户端在 2 个基础尺度之外，由系统效率感知策略额外补发的尺度数量。
  system_extra_scale_count: 2

ablation:
  UseJointKD: False
  UseJointCL: False
  UseScaleKD: True
  UseScaleCL: False
  UseProdictor: False
  UseMTLHomo: False
  UseACF: True
  UseDistribution: False

logPath: "./result/"
description: "fedcsl-onehot-splitteacher"
