model:
  name: ""
  params:
    dist_measure: "mix"
    lr: 0.05
    batch_size: 16 # HAR baseline 统一：16
    wd: 0
    momentum: 0.9
    ls: 1
    l: 0.01
    beta: 0.4
    gamma: 0.5
dataset: "CharacterTrajectories"
algo: "fedproto"
federated:
  numClient: 3
  numRound: 200
  numEpoch: 3
  dirichlet_alpha: 1
