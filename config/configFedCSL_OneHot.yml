model:
  name: ""
  params:
    dist_measure: "mix"
    lr: 0.05
    batch_size: 8 # HAR baseline 统一：16
    wd: 0
    ls: 1         # l3 多粒度学习
    l: 0.01       # l4 正则化系数
    beta: 0.4
    gamma: 0.5
dataset: "AtrialFibrillation"
# 关键：FedCSL 的 one-hot 变体。
# 与 fedcsl 的唯一差异在 update_CL：
#   - 每个 client 按 period_score(argmax) 选中 **唯一** 一个尺度索引；
#   - 仅在该尺度上计算 local/global InfoNCE 与 KD，其它尺度跳过；
#   - 服务端仍用 FedAvg 聚合模型参数（全部尺度的 shapelet 仍会被更新，
#     只是每轮由选到那个尺度的客户端主导；这对应 "server 端合理聚合"）。
algo: "fedcsl-onehot"
federated:
  numClient: 3
  numRound: 200
  numEpoch: 3
  dirichlet_alpha: 1
  use_client_selection: False
  client_selection_ratio: 0.6
  checkpoint_every: 30
  auto_resume: True

ablation:
  UseJointKD: True
  UseJointCL: True
  UseScaleKD: True
  UseScaleCL: True
  UseProdictor: False
  UseMTLHomo: False
  UseACF: True              # 使用 period_score 对 8 个尺度打分
  UseDistribution: False

logPath: "./result/"
description: "fedcsl-onehot"
