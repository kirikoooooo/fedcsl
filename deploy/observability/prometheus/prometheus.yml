global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s
  external_labels:
    stack: fedcsl-local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fedcsl-exporter
    static_configs:
      - targets: ["host.docker.internal:9108"]
        labels:
          env: local
          component: training

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
