model:
  name: ""
  params:
    dist_measure: "mix"
    lr: 0.1
    batch_size: 8
    wd: 0.0001
    momentum: 0.9
    ls: 1
    l: 0.01
    beta: 0.4
    gamma: 0.5
dataset: "CharacterTrajectories"
algo: "fedcsl-simclr-split"
federated:
  numClient: 3
  numRound: 200
  numEpoch: 3
  dirichlet_alpha: 1
  use_client_selection: False
  client_selection_ratio: 0.6
spilter:
  # efficiency_aware: 2个基础尺度 + 系统效率感知补发；uniform_single: client_id 轮转，每个客户端只训练1个尺度。
  allocation_mode: "efficiency_aware"
  # 每个客户端在 2 个基础尺度之外，由系统效率感知策略额外补发的尺度数量。
  system_extra_scale_count: 2
ablation:
  UseJointKD: False
  UseJointCL: False
  UseScaleKD: False
  UseScaleCL: False
  UseProdictor: False
  UseMTLHomo: False
  UseACF: True
  UseDistribution: False
ssl:
  temperature: 0.2
  projector_hidden_dim: 256
  projector_out_dim: 128
  predictor_hidden_dim: 256
  ema_tau: 0.99
logPath: "./result/"
description: "fedcsl-simclr-split"
