[project]
name = "fl-bench"
version = "0.2.0"
description = "Benchmark of federated learning that aim solving image classification tasks."
authors = [
    {name = "KarhouTam", email = "karhoutam@qq.com"},
    {name = "Xinpeng Wang", email = "223015056@link.cuhk.edu.cn"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "torchvision",
    "rich",
    "pandas",
    "visdom",
    "Pillow",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "faiss-cpu",
    "pynvml",
    "PyYAML",
    "ray[default]",
    "tensorboard",
    "cvxpy",
    "hydra-core",
    "flwr-datasets",
    "statsmodels",
    "pytorch-minimize",
]

[project.urls]
Repository = "https://github.com/KarhouTam/FL-bench"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
