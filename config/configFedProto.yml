model:
  name: ""
  params:
    dist_measure: "mix"
    lr: 0.05
    batch_size: 8 # HAR baseline 统一：16
    wd: 0
    momentum: 0.9
    ls: 1
    l: 0.01
    beta: 0.4
    gamma: 0.5
dataset: "CharacterTrajectories"
algo: "fedproto"
federated:
  numClient: 3
  numRound: 200
  numEpoch: 3
  dirichlet_alpha: 1
  use_client_selection: False
  client_selection_ratio: 0.6

  checkpoint_every: 30  # 每 N 轮覆盖保存 resume checkpoint（0=关闭）
  auto_resume: True     # 启动时若存在 resume ckpt 则自动续训
ablation:
  UseJointKD: False
  UseJointCL: False
  UseScaleKD: False
  UseScaleCL: False
  UseProdictor: False
  UseMTLHomo: False
  UseACF: False
  UseDistribution: False

# FedProto 方法专属超参，移植自 FL-bench src/server/fedproto.py:get_hyperparams
fedproto:
  lamda: 1.0   # MSE 原型对齐损失权重

logPath: "./result/"
description: "fedproto"
