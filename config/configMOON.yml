model:
  name: ""
  params:
    dist_measure: "mix"
    lr: 0.05
    batch_size: 16
    wd: 0
    ls: 1
    l: 0.01
    beta: 0.4
    gamma: 0.5
dataset: "HAR"
algo: "moon"
federated:
  numClient: 3
  numRound: 200
  numEpoch: 3
  dirichlet_alpha: 1
  use_client_selection: False
  client_selection_ratio: 0.6
  checkpoint_every: 30
  auto_resume: True
ablation:
  UseJointKD: False
  UseJointCL: False
  UseScaleKD: False
  UseScaleCL: False
  UseProdictor: False
  UseMTLHomo: False
  UseACF: False
  UseDistribution: False
moon:
  mu: 1.0
  temperature: 0.5
logPath: "./result/"
description: "moon"

evaluation:
  protocol: "svm"  # options: svm | linear_probe
  svm_c_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  linear_probe:
    lr: 0.001
    wd: 0.0001
    batch_size: 256
    max_epoch: 200
    eval_interval: 1
    seed: 42
