model:
  name: ""
  params:
    dist_measure: "cosine"
    lr: 0.05     # 当dataset=HAR时为0.05
    batch_size: 8 # 当dataset=HAR时为256
    wd: 0
    ls: 1         #l3 多粒度学习
    l: 0.01       #l4 正则化系数

dataset: "HAR"

federated:
  numClient: 3
  numRound: 1000
  numEpoch: 3 
  dirichlet_alpha: 0.1

ablation:
  UseJointKD: True
  UseJointCL: True
  UseScaleKD: True
  UseScaleCL: True
  UseProdictor: False
  UseMTLHomo: False     # 方差多任务学习
  UseACF: True
  UseDistribution: False

logPath: "./result/"
description: "testBatchScore*10"

evaluation:
  protocol: "svm"  # options: svm | linear_probe
  svm_c_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  linear_probe:
    lr: 0.001
    wd: 0.0001
    batch_size: 256
    max_epoch: 200
    eval_interval: 1
    seed: 42
