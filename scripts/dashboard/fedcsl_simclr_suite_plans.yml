defaults:
  # 默认数据集。若通过 suite 脚本传入 DATASET=...，
  # runner 会把这里和各个 plan 里的 dataset 全部覆盖掉。
  dataset: HAR
  dirichlet_alpha: 0.1
  seed: 42
  num_round: 5
  gate_acc: 0.90

plans:
  - name: fedcsl_ms_period_ref
    config: config/configACF.yml
    description: FedCSL reference with multi-scale + period score kept on.
    notes: Baseline anchor. All candidates below preserve multi-scale and UseACF=True.

  - name: fedcsl_ms_period_gamma07
    config: config/configACF.yml
    description: Increase local contrastive weight.
    config_overrides:
      model:
        params:
          gamma: 0.7

  - name: fedcsl_ms_period_gamma09
    config: config/configACF.yml
    description: Stronger local contrastive dominance.
    config_overrides:
      model:
        params:
          gamma: 0.9

  - name: fedcsl_ms_period_temp01
    config: config/configACF.yml
    description: Lower contrastive temperature.
    extra_args: ["-T", "0.1"]

  - name: fedcsl_ms_period_temp02
    config: config/configACF.yml
    description: SimCLR-like temperature.
    extra_args: ["-T", "0.2"]

  - name: fedcsl_ms_period_temp03
    config: config/configACF.yml
    description: Softer temperature.
    extra_args: ["-T", "0.3"]

  - name: fedcsl_ms_period_lr001
    config: config/configACF.yml
    description: Lower learning rate.
    config_overrides:
      model:
        params:
          lr: 0.01

  - name: fedcsl_ms_period_lr003
    config: config/configACF.yml
    description: Mid learning rate.
    config_overrides:
      model:
        params:
          lr: 0.03

  - name: fedcsl_ms_period_lr005
    config: config/configACF.yml
    description: Reference learning rate.
    config_overrides:
      model:
        params:
          lr: 0.05

  - name: fedcsl_ms_period_wd1e4
    config: config/configACF.yml
    description: SimCLR-like weight decay.
    config_overrides:
      model:
        params:
          wd: 0.0001

  - name: fedcsl_ms_period_wd5e4
    config: config/configACF.yml
    description: Stronger weight decay.
    config_overrides:
      model:
        params:
          wd: 0.0005

  - name: fedcsl_ms_period_bs32
    config: config/configACF.yml
    description: Larger batch size for stronger negatives.
    config_overrides:
      model:
        params:
          batch_size: 32

  - name: fedcsl_ms_period_bs64
    config: config/configACF.yml
    description: Even larger batch size.
    config_overrides:
      model:
        params:
          batch_size: 64

  - name: fedcsl_ms_period_joint_only
    config: config/configACF.yml
    description: Keep joint CL/KD, disable scale CL/KD.
    config_overrides:
      ablation:
        UseJointKD: true
        UseJointCL: true
        UseScaleKD: false
        UseScaleCL: false
        UseACF: true

  - name: fedcsl_ms_period_scale_only
    config: config/configACF.yml
    description: Keep scale CL/KD, disable joint CL/KD.
    config_overrides:
      ablation:
        UseJointKD: false
        UseJointCL: false
        UseScaleKD: true
        UseScaleCL: true
        UseACF: true

  - name: fedcsl_ms_period_cl_only
    config: config/configACF.yml
    description: Contrastive alignment only, KD off.
    config_overrides:
      ablation:
        UseJointKD: false
        UseJointCL: true
        UseScaleKD: false
        UseScaleCL: true
        UseACF: true

  - name: fedcsl_ms_period_kd_only
    config: config/configACF.yml
    description: Distillation only, CL off.
    config_overrides:
      ablation:
        UseJointKD: true
        UseJointCL: false
        UseScaleKD: true
        UseScaleCL: false
        UseACF: true

  - name: fedcsl_ms_period_no_distribution
    config: config/configACF.yml
    description: Disable distribution weighting, keep period scoring.
    config_overrides:
      ablation:
        UseDistribution: false
        UseACF: true

  - name: fedcsl_ms_period_with_distribution
    config: config/configACF.yml
    description: Explicitly enable distribution weighting.
    config_overrides:
      ablation:
        UseDistribution: true
        UseACF: true

  - name: fedcsl_ms_period_beta02
    config: config/configACF.yml
    description: Period score fusion with smaller beta.
    config_overrides:
      model:
        params:
          beta: 0.2

  - name: fedcsl_ms_period_beta06
    config: config/configACF.yml
    description: Period score fusion with larger beta.
    config_overrides:
      model:
        params:
          beta: 0.6

  - name: fedcsl_ms_period_alpha005
    config: config/configACF.yml
    dirichlet_alpha: 0.05
    description: Strong heterogeneity stress test.

  - name: fedcsl_ms_period_alpha03
    config: config/configACF.yml
    dirichlet_alpha: 0.3
    description: Mild heterogeneity stress test.

  - name: fedcsl_ms_period_seed7
    config: config/configACF.yml
    seed: 7
    description: Seed sweep.

  - name: fedcsl_ms_period_seed123
    config: config/configACF.yml
    seed: 123
    description: Seed sweep.

  - name: fedcsl_ms_period_epoch1
    config: config/configACF.yml
    description: Fewer local epochs.
    config_overrides:
      federated:
        numEpoch: 1

  - name: fedcsl_ms_period_epoch5
    config: config/configACF.yml
    description: More local epochs.
    config_overrides:
      federated:
        numEpoch: 5

  - name: fedcsl_ms_period_simclrish
    config: config/configACF.yml
    description: Keep FedCSL base, but push other hyperparameters toward SimCLR style.
    config_overrides:
      model:
        params:
          lr: 0.05
          wd: 0.0001
          batch_size: 32
          gamma: 0.9
          beta: 0.4
      ablation:
        UseJointKD: false
        UseJointCL: false
        UseScaleKD: false
        UseScaleCL: false
        UseDistribution: false
        UseACF: true
