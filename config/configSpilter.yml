model:
  name: ""
  params:
    dist_measure: "mix"
    lr: 0.01
    batch_size: 32
    wd: 0.0001
    momentum: 0.9
    ls: 1
    l: 0.01
    beta: 0.4
    gamma: 0.7
dataset: "AtrialFibrillation"
algo: "spilter"
federated:
  numClient: 50
  numRound: 200
  numEpoch: 1
  dirichlet_alpha: 1
  use_client_selection: False
  client_selection_ratio: 0.6
  checkpoint_every: 0
  auto_resume: false

spilter:
  # === Supported allocation_mode values ===
  #   local_score_topm            — each client selects top-m scales from its own period-score distribution.
  #   local_score_random_topm     — randomly select m scales per client (non-topM, uniform distribution).
  #   uniform_single              — client_id round-robin, one scale per client.
  #   global_score_random_single  — sample one scale from the global period-score distribution.
  #   efficiency_aware            — period-aware seed scales plus system-efficiency extras.
  #   knapsack_lagrangian         — 0-1 knapsack per client under memory budget,
  #                                  with Lagrange relaxation for global scale coverage.
  #                                  Requires spilter.knapsack_lagrangian subsection (see below).
  allocation_mode: "local_score_topm"
  local_top_m: 4
  # stitched: concatenate selected scales into one local submodel representation.
  selected_scale_training: "stitched"
  system_extra_scale_count: 2
  # stitched：selected_scales_only（默认）= encode_mix_forward_selected_scales（FedCSL forward 同源管线，仅所选尺度）；
  # forward_slices = 全尺度 forward 后切片（与 FedCSL 表征对照）；subset_ln_forward_scale = 旧版辅助项二次 encode_scale。
  stitched_feature_source: "selected_scales_only"

  # ═══════════════════════════════════════════════════════════════════════════
  # Knapsack-Lagrangian Scale Allocation (§7.7)
  # ═══════════════════════════════════════════════════════════════════════════
  # Used when allocation_mode = "knapsack_lagrangian".
  #
  # ── Problem formulation ──────────────────────────────────────────────────
  # Each client k runs a 0-1 knapsack to select scales under a memory budget,
  # while the server ensures global coverage of all R=8 scales via Lagrange
  # relaxation:
  #
  #   max  Σ_k Σ_r  period_score_{k,r} · x_{k,r}
  #   s.t. g_0 + Σ_r g_r · x_{k,r} ≤ B_k   ∀k  (memory / OOM)
  #        Σ_k x_{k,r} ≥ C_min              ∀r  (global coverage)
  #
  #   → Decomposed into K independent knapsacks:
  #     max  Σ_r (period_score_{k,r} + λ_r) · x_{k,r}
  #     s.t. g_0 + Σ_r g_r · x_{k,r} ≤ B_k
  #
  #   → λ_r updated via subgradient (coverage deficit → λ_r ↑):
  #     λ_r ← max(0, λ_r + η/√t · (C_min − Σ_k x_{k,r}))
  #
  # ── Memory costs (g_r) — how to get them ─────────────────────────────────
  # Three options, in priority order:
  #   1. Set scale_memory_costs_mb in this config (real GPU-profiled values).
  #      Example below is HAR on RTX 3090, batch_size=32, mix distance:
  #      scale_memory_costs_mb: [45.5, 65.0, 79.7, 88.7, 92.4, 90.4, 80.6, 67.9]
  #      base_memory_mb: 25.9   # g_0 = min(g_r) * 0.5 (conservative estimate)
  #
  #   2. **Auto-calibrate** (default): omit scale_memory_costs_mb.  On first
  #      run, the code creates a LearningShapeletsCL client per scale, trains
  #      1 epoch with SGD+momentum, and measures peak CUDA memory (same
  #      protocol as scripts/system_efficiency/measure_scale_memory.py).
  #      Results are cached to data/knapsack_calibration/<dataset>_scale_memory.json
  #      and reused on subsequent runs.
  #
  #   3. System proxy fallback (CPU-only): uses _scale_system_costs as
  #      unitless relative weights.  Budget is then also unitless.
  #
  # ── Parameters ───────────────────────────────────────────────────────────
  # memory_budget_mb: per-client GPU memory budget in MB.
  #   - float (e.g. 128): same budget for all clients
  #   - list of floats [K]: per-client budgets
  #   - CLI override: --spilter-memory-budget 128
  #   - omitted: auto-set to 60% of total g_r (fits ~5-6 of 8 scales)
  # memory_budget_mb: 128
  #
  # scale_memory_costs_mb: per-scale marginal memory g_r, length R=8 (MB).
  #   - omitted: auto-calibrate on GPU (cached), or system_proxy on CPU
  #
  # base_memory_mb: fixed overhead g_0 (model + optimizer excl. scale branches).
  #   - omitted: auto-estimated from calibration or 0
  #
  # knapsack_lagrangian:
  #   coverage_min: minimum clients that must cover each scale (C_min).
  #     - int: same for all scales (default: ceil(K / R))
  #   coverage_min: 6
  #
  #   lambda_lr: initial subgradient step size η (decays as 1/√t).
  #     Larger → faster convergence but may oscillate.  Default 0.1.
  #   lambda_lr: 0.1
  #
  #   max_iter: maximum Lagrange iterations (default 50).
  #     Early-stops on convergence or plateau.
  #   max_iter: 50

ablation:
  UseJointKD: True
  UseJointCL: True
  UseScaleKD: True
  UseScaleCL: True
  UseProdictor: False
  UseMTLHomo: False
  UseACF: True
  UseDistribution: False

logPath: "./result/"
description: "spilter-local-topm"

evaluation:
  protocol: "svm"  # options: svm | linear_probe
  round_eval_interval: 1  # downstream eval every N federated rounds (always eval round 0 and final round)
  svm_c_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  linear_probe:
    lr: 0.001
    wd: 0.0001
    batch_size: 256
    max_epoch: 200
    eval_interval: 1
    seed: 42
