model:
  name: ""
  params:
    dist_measure: "mix"
    lr: 0.05     # 当dataset=HAR时为0.05
    batch_size: 16 # HAR baseline 统一：16
    wd: 0
    ls: 1         #l3 多粒度学习
    l: 0.01       #l4 正则化系数 default0.01
    beta: 0.4     # 长短期融合系数
    gamma: 0.5    # 本地和全局融合系数
dataset: "CharacterTrajectories"
algo: "fedprox"
federated:
  numClient: 3
  numRound: 200
  numEpoch: 3
  dirichlet_alpha: 1

  checkpoint_every: 30  # 每 N 轮覆盖保存 resume checkpoint（0=关闭）
  auto_resume: True     # 启动时若存在 resume ckpt 则自动续训
ablation:
  UseJointKD: False
  UseJointCL: False
  UseScaleKD: False
  UseScaleCL: False
  UseProdictor: False
  UseMTLHomo: False     # 方差多任务学习
  UseACF: False
  UseDistribution: False
logPath: "./result/"
description: "fedprox+selection"