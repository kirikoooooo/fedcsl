model:
  name: ""
  params:
    dist_measure: "mix"
    lr: 0.05     # 当dataset=HAR时为0.05
    batch_size: 32 # 当dataset=HAR时为256
    wd: 0
    ls: 0.01         #l3 多粒度学习 1
    l: 0.1       #l4 正则化系数 0.01
    beta: 0.4
    gamma: 0.5    # 本地和全局融合系数
dataset: "Epilepsy"
algo : "fedcsl"
federated:
  numClient: 30
  numRound: 500
  numEpoch: 3
  dirichlet_alpha: 1
  use_client_selection: False  # 是否启用客户端选择
  client_selection_ratio: 0.6   # 客户端选择比例（当use_client_selection为True时生效）

ablation:
  UseJointKD: True
  UseJointCL: True
  UseScaleKD: True
  UseScaleCL: True
  UseProdictor: False
  UseMTLHomo: False     # 方差多任务学习
  UseACF: False
  UseDistribution: False
logPath: "./result/"
description: "Onlyallscale+mix_l=0.1"

evaluation:
  protocol: "svm"  # options: svm | linear_probe
  svm_c_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  linear_probe:
    lr: 0.001
    wd: 0.0001
    batch_size: 256
    max_epoch: 200
    eval_interval: 1
    seed: 42
